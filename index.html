<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己分析アプリ - あなたの人材タイプを診断</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <div class="header">
                <h1>自己分析診断</h1>
                <p class="subtitle">あなたの強みと人材タイプを見つけましょう</p>
            </div>
            <div class="content">
                <p class="description">
                    この診断では、10の質問を通してあなたの特性を分析し、<br>
                    最適な人材タイプを判定します。<br>
                    転職活動や自己理解に役立ててください。
                </p>
                <button id="start-btn" class="btn btn-primary">診断を始める</button>
            </div>
        </div>

        <!-- 質問画面 -->
        <div id="question-screen" class="screen">
            <div class="header">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p class="progress-text">質問 <span id="current-question">1</span> / <span id="total-questions">10</span></p>
            </div>
            <div class="content">
                <h2 id="question-text" class="question-text"></h2>
                <div id="answers" class="answers"></div>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <div class="header">
                <h1>診断結果</h1>
            </div>
            <div class="content">
                <div id="result-type" class="result-type"></div>
                <h2 id="result-title" class="result-title"></h2>
                <p id="result-description" class="result-description"></p>
                <div class="result-details">
                    <h3>あなたの強み</h3>
                    <ul id="result-strengths"></ul>
                    <h3>適した職種・役割</h3>
                    <ul id="result-careers"></ul>
                    <h3>成長のためのアドバイス</h3>
                    <p id="result-advice"></p>
                </div>
                <button id="restart-btn" class="btn btn-secondary">もう一度診断する</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 自己分析アプリ</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
