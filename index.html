<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI性格診断 - あなたの性格タイプを発見</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <div class="header">
                <h1>MBTI性格診断</h1>
                <p class="subtitle">16タイプであなたの性格を発見</p>
            </div>
            <div class="content">
                <p class="description">
                    MBTI理論に基づいた質問を通して、<br>
                    あなたの性格タイプを診断します。<br>
                    4つの指標（外向/内向、感覚/直観、思考/感情、判断/知覚）から<br>
                    16タイプのいずれかを判定します。<br>
                    <br>
                    各質問に「そう思う」～「そう思わない」の7段階で回答してください。<br>
                    転職活動やキャリア開発に役立ててください。
                </p>
                <button id="start-btn" class="btn btn-primary">診断を始める</button>
            </div>
        </div>

        <!-- 質問画面 -->
        <div id="question-screen" class="screen">
            <div class="header">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p class="progress-text">質問 <span id="current-question">1</span> / <span id="total-questions">10</span></p>
            </div>
            <div class="content">
                <h2 id="question-text" class="question-text"></h2>
                <div id="answers" class="answers"></div>
                <button id="back-btn" class="btn btn-back" style="display: none;">← 戻る</button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <div class="header">
                <h1>診断結果</h1>
            </div>
            <div class="content">
                <div id="result-type" class="result-type"></div>
                <h2 id="result-title" class="result-title"></h2>
                <p id="result-description" class="result-description"></p>
                <div id="score-details" class="score-details"></div>
                <div class="result-details">
                    <h3>あなたの強み</h3>
                    <ul id="result-strengths"></ul>
                    <h3>適した職種・役割</h3>
                    <ul id="result-careers"></ul>
                    <h3>成長のためのアドバイス</h3>
                    <p id="result-advice"></p>
                </div>
                <button id="restart-btn" class="btn btn-secondary">もう一度診断する</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 自己分析アプリ</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
